name: infra-deploy

on:
  push:
    branches: [main]
    # snapshot commits touch none of these, so the publisher can never trigger a deploy
    paths:
      - 'infra/**'
      - 'services/**'
      - 'packages/**'
      - package-lock.json

concurrency:
  group: infra-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the OIDC deploy role trusts exactly this environment, and the environment holds the
    # required reviewer
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: cdk deploy
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: npx -w infra cdk deploy CertTracker-prod -c stage=prod --require-approval never
