name: data-guard

on:
  pull_request:
    paths:
      - apps/web/src/data/snapshot.json

permissions:
  contents: read

jobs:
  refuse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse hand edits to the snapshot
        run: |
          echo "::error file=apps/web/src/data/snapshot.json::This file is written by the publish Lambda and pushed straight to main. A pull request that changes it is always a mistake."
          echo "Change the data through the admin UI or scripts/admin, then let the publisher regenerate the snapshot." >> "$GITHUB_STEP_SUMMARY"
          exit 1
