name: infra-diff

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'services/**'
      - 'packages/**'

concurrency:
  group: infra-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff:
    # pull requests from forks get no OIDC token for this repository, so there is nothing to run
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_READONLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: cdk diff
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          {
            echo '### cdk diff (prod)'
            echo
            echo '```'
            npx -w infra cdk diff CertTracker-prod -c stage=prod --no-color 2>&1 | tail -n 300
            echo '```'
          } > "$RUNNER_TEMP/diff.md"

      - name: Post the diff as a sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/diff.md"
