<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Free IT certification exam vouchers, discounts and free certificates from Microsoft, AWS, Google Cloud and 20+ vendors, each checked on the vendor's own page."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#141a16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="/favicon-dark.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <!-- ?offer= deep links show the same table, so they all point back to the root -->
    <link rel="canonical" href="https://latentdata.org/" />
    <!-- link previews in chat apps and social sites don't run the bundle; they only see these -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LatentData" />
    <meta property="og:url" content="https://latentdata.org/" />
    <meta property="og:title" content="Free IT certification exams, tracked and verified" />
    <meta
      property="og:description"
      content="Exam vouchers, free training with badges and discount codes, with dates and eligibility checked against each vendor's own page."
    />
    <!-- drawn by scripts/og-image.ts -->
    <meta property="og:image" content="https://latentdata.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="LatentData Cert Promo Tracker: free IT certification exams, tracked and verified."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Free IT Certification Vouchers &amp; Promos · LatentData</title>
    <script>
      // pick the theme before first paint so the page doesn't flash the wrong colour, and start
      // fetching its stylesheet now rather than after the app bundle has run
      (function () {
        var mode;
        try {
          mode = localStorage.getItem('cert-tracker:theme:v1');
        } catch (e) {
          mode = null;
        }
        // dark is the house default; the OS preference is not consulted (theme.ts agrees)
        if (mode !== 'light' && mode !== 'dark') mode = 'dark';
        document.documentElement.dataset.theme = mode;
        var link = document.createElement('link');
        link.id = 'theme-link';
        link.rel = 'stylesheet';
        link.href = '/themes/lara-' + mode + '-blue/theme.css';
        document.head.appendChild(link);
      })();
    </script>
    <style>
      html[data-theme='light'] {
        background: #f4f5f1;
        color: #1f2a1f;
      }
      html[data-theme='dark'] {
        background: #141a16;
        color: #d5dde9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
